name: Auto Deploy to FTP
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ============================
      # Upload folder PUBLIC
      # ============================
      - name: Deploy PUBLIC to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.2
        with:
          server: ftp.zulfiqri.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public
          server-dir: public_html
          protocol: ftps
          exclude: |
            **/.git*
            **/.github*

      # ============================
      # Upload file yang berubah dari folder APP
      # (BUKAN full folder!)
      # ============================
      - name: Deploy APP to ci4_app/app (diff only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.2
        with:
          server: ftp.zulfiqri.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: app
          server-dir: ci4_app/app
          protocol: ftps
          exclude: |
            **/Cache/*
            **/Logs/*
            **/Sessions/*
