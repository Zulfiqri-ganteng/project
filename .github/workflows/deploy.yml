name: Auto Deploy CI4

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # =============================================================
      # DEPLOY PUBLIC ke public_html
      # =============================================================
      - name: Upload PUBLIC to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.2
        with:
          server: ftp.zulfiqri.com
          username: deployci4@zulfiqri.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: public/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github*

      # =============================================================
      # DEPLOY APP (kecuali vendor & env) ke folder ci4
      # =============================================================
      - name: Upload APP to ci4 folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.2
        with:
          server: ftp.zulfiqri.com
          username: deployci4@zulfiqri.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: /ci4/
          exclude: |
            vendor/**
            public/**
            writable/**
            .env
            .git/**
            .github/**
            tests/**
