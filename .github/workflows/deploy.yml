name: Auto Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1️⃣ Deploy isi folder PUBLIC ke /public_html
      - name: Deploy PUBLIC to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.2
        with:
          server: ftp.zulfiqri.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: public/ # ← HARUS ADA / DI BELAKANGNYA !!!
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github*
            **/tests*
            **/vendor*
            composer.*

      # 2️⃣ Deploy folder APP (diff only) ke ci4_app/app
      - name: Deploy APP to ci4_app/app (diff only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.2
        with:
          server: ftp.zulfiqri.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: app/
          server-dir: /ci4_app/app/
          exclude: |
            **/Config/Paths.php
            **/Config/Boot/*
